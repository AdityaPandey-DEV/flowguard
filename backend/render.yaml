services:
  - type: web
    name: flowguard-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 5000
      - key: RATE_LIMIT_DEFAULT
        value: 100
      - key: RATE_LIMIT_WINDOW
        value: 60
      - key: MAX_QUEUE_SIZE
        value: 1000
      - key: WORKER_THREADS
        value: 2
